name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    name: QA (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Security audit (Production)
        run: npm audit --omit=dev --audit-level=high

      - name: Build monorepo packages
        run: npm run build

      - name: 'Test: @razerspine/build (E2E)'
        run: npm run test:build

      - name: 'Test: @razerspine/runtime (Unit & E2E)'
        run: npm run test:runtime

      - name: 'Test: @razerspine/ui (Integration & Snapshots)'
        run: npm run test:ui

      - name: 'Test: @razerspine/create (Unit & Integration & E2E)'
        run: npm run test:cli
